
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Management System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #243b70;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #172554;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 18px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }

        .hero h2 {
            font-size: 32px;
            color: #243b70;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
        }

        .buttons a {
            display: inline-block;
            background: #243b70;
            color: white;
            padding: 13px 25px;
            margin: 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        .buttons a:hover {
            background: #4361a5;
        }

        footer {
            background: #172554;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>College Event Management System</h1>
        <p>Plan, Participate and Celebrate!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="admin.html">Admin</a>
        <a href="user.html">User</a>
    </nav>

    <section class="hero">
        <h2>Welcome to Our College Events</h2>
        <p>
            Discover exciting college events, workshops,
            technical fests and cultural programs.
        </p>

        <div class="buttons">
            <a href="user.html">View Events & Register</a>
            <a href="admin.html">Admin Dashboard</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 College Event Management System</p>
    </footer>

</body>
</html>
